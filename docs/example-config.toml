# slogger configuration — annotated example
#
# Place at ~/.config/slogger/config.toml (Linux/macOS) or
# %APPDATA%\slogger\config.toml (Windows).
#
# Every section is optional. A completely absent file launches slogger
# with all external integrations off and only the manual-logging surface
# active.
#
# Every option slogger reads is listed here, in its section, either live
# or commented out — a test fails if one is added without being shown.
# Commented-out lines show an example value, not necessarily the default;
# the note beside each says what the default is where it matters.
#
# See plans/features-and-configuration.md for per-feature details.

# ============================================================
# [station] — operator default callsign
# ============================================================
#
# Used as a fallback when no station_location is selected (e.g. on first
# launch, before the operator creates one). Once a station_location is
# selected in the UI, its station_callsign overrides this.

[station]
# default_callsign = "W1ABC"


# ============================================================
# [[rig]] — rig control (multi-rig array)
# ============================================================
#
# Write one [[rig]] block per radio. SO2R operators write two.
# Defaults to NO rigs configured. The first entry is the boot-active rig.
#
# Supported vendors: "icom", "yaesu", "kenwood", "elecraft", "flex"
# Model names are case- and hyphen-insensitive ("IC-7300" = "ic7300").

# [[rig]]
# enabled = true
# vendor = "icom"
# model = "IC-7300"
# serial_port = "/dev/ttyUSB0"  # required for icom/yaesu/kenwood/elecraft
# baud_rate = 115200             # optional; vendor default if unset
# host = "192.168.1.50"          # flex only: hostname or IP (see below)
# label = "Main"                 # optional; defaults to model name
# transceive = true             # optional; default false. How slogger
#                                # follows the VFO knob:
#   false — slogger polls the rig for frequency and mode at 4 Hz.
#     Works with no rig setup, but the constant traffic can make the
#     rig miss front-panel button presses (seen on an IC-7610: the
#     FILTER button did not always change the filter).
#   true — no polling; slogger only listens for the rig's own
#     broadcasts. Recommended if front-panel buttons misbehave while
#     slogger is running.
#       Yaesu/Kenwood/Elecraft: switched on for you at connect.
#       Icom: you must also enable CI-V Transceive in the rig's menu
#         (IC-7610: Menu > Set > Connectors > CI-V > CI-V Transceive),
#         or nothing will update.
#       Flex: ignored.

# Second rig for SO2R (uncomment + fill):
# [[rig]]
# enabled = true
# vendor = "yaesu"
# model = "FT-DX10"
# serial_port = "/dev/ttyUSB3"
# label = "Aux"

# FlexRadio example (TCP instead of serial):
# [[rig]]
# enabled = true
# vendor = "flex"
# model = "6400"
# host = "192.168.1.50"          # required for flex; serial_port unused
# label = "Flex"


# ============================================================
# [keyer] — CW keyer (K1EL WinKeyer / compatible)
# ============================================================

[keyer]
# enabled = true
# serial_port = "/dev/ttyUSB1"
# initial_wpm = 25                 # 5..50; defaults to 25
# sidetone = false                # default true. false silences the
#                                  # WinKeyer's own sidetone; use it when
#                                  # the rig's sidetone is enough, or when
#                                  # the keyer's tone reaches your
#                                  # headphones as well as the rig's.

# Message buttons for the CW keyer pane. The first twelve are bound to
# F1..F12 in the order written. Leave these out to get the built-in set
# (CQ, His call, Report, TU, My call, AGN); writing any [[keyer.macro]]
# replaces that set entirely.
#
# Placeholders, filled in when the message is sent:
#   {MYCALL}  your callsign (active station, else [station].default_callsign)
#   {CALL}    the callsign in the entry form
#   {RST}     the sent report from the entry form, 9 keyed as N (599 -> 5NN)
#
# [[keyer.macro]]
# label = "CQ"
# text = "CQ CQ DE {MYCALL} {MYCALL} K"
#
# [[keyer.macro]]
# label = "Report"
# text = "{CALL} UR {RST} {RST}"
#
# [[keyer.macro]]
# label = "TU"
# text = "TU 73"


# ============================================================
# [so2r] — OTRSP SO2R switch
# ============================================================
#
# Hardware switch (microHAM MK2R, OTRSP Lite, etc.) that routes
# PTT/key/mic and audio between two rigs in real-time. Requires
# multi-rig setup ([[rig]] x 2) to be useful.

[so2r]
# enabled = true
# serial_port = "/dev/ttyUSB2"
# initial_tx = 1                   # 1 or 2
# initial_rx_mode = "stereo"       # "mono" / "stereo" / "reverse_stereo"


# ============================================================
# [wsjtx] — WSJT-X UDP bridge (auto-import logged QSOs)
# ============================================================
#
# Default: enabled = true, bind_addr = 127.0.0.1:2237. The bridge stays
# idle until WSJT-X actually sends; binding costs nothing.
#
# WSJT-X side: File → Settings → Reporting:
#   UDP Server = 127.0.0.1, port 2237
#   ☑ Accept UDP requests
#   ☑ Notify on accepted UDP request
#   ☑ Logged QSO ADIF

[wsjtx]
# enabled = true
# bind_addr = "127.0.0.1:2237"     # use "0.0.0.0:2237" for cross-machine


# ============================================================
# [dxcluster] — DX cluster spot feed
# ============================================================
#
# Connects to one or more cluster nodes; spots flow into the in-app
# panel with click-to-tune-rig + need-by-band annotation.

[dxcluster]
# my_callsign = "W1ABC"
# sources = [
#     { host = "dxc.kbx.org", port = 7300 },
#     { host = "n1nr.org",     port = 7300 },
# ]

# Optional dxfeed filter (JSON file, hand-authored). See dxfeed docs for
# the schema. Drops spots before they reach the panel.
# filter_file = "/home/me/.config/slogger/spot-filter.json"


# ============================================================
# [condx] — solar / propagation conditions (CondX panel)
# ============================================================
#
# Polls N0NBH's feed at hamqsl.com for SFI, sunspots, A/K indices, X-ray,
# geomagnetic field, signal noise and per-band day/night ratings, shown in
# the Operating view's CondX panel (open it from the PANELS bar). Off by
# default: with enabled = false slogger never contacts hamqsl.com. A failed
# fetch is logged and retried at the next interval.

[condx]
# enabled = true
# refresh_interval_secs = 3600     # default 3600 (hourly); minimum 60


# ============================================================
# [pota] — Parks on the Air activator spots
# ============================================================
#
# Shows current POTA activators in the Spots pane, from the public feed
# at pota.app (no account needed). Each is marked POTA with its park. An
# activator the DX cluster also has on the same band is one row, not two.
# Spots marked QRT are dropped. slogger does not record parks or track
# which you have worked.
#
# The POTA button in the Spots pane switches these on and off at any
# time, and slogger remembers that choice; `enabled` only decides how
# slogger starts before you have ever pressed the button. While off,
# slogger never contacts pota.app. This section works without [dxcluster].

[pota]
# enabled = true                   # default false
# bands = ["20m", "40m"]           # default: every band
# modes = ["CW", "SSB"]            # default: every mode. Names as POTA
#                                  # gives them: CW, SSB, FT8, FT4, FM, AM...
# refresh_interval_secs = 60       # default 60; minimum 60


# ============================================================
# Sync services
# ============================================================
#
# All five drive from one Update services button. Each fails
# independently. The button is a no-op if no service is configured.

# ----------------------------------------
# [lotw] — ARRL Logbook of the World
# ----------------------------------------
#
# Upload requires TQSL on PATH (or set tqsl_path). Which TQSL station
# location signs which QSOs is NOT set here: each slogger station location
# names its own TQSL location (bottom bar -> Edit). QSOs whose location
# has no TQSL location, or names one TQSL doesn't have, are held back and
# the upload summary says why. Fetch verifies (your QSO is at LotW) AND
# confirms (other station also has matching) in one round-trip.

[lotw]
# username = "W1ABC"               # LotW website login (NOT the cert)
# password = "your-lotw-website-password"
# tqsl_path = "/usr/bin/tqsl"      # override only if not on PATH
# tqsl_station_data = "/home/you/.tqsl/station_data"
#                                  # TQSL's list of station locations; only
#                                  # needed if TQSL keeps it somewhere other
#                                  # than ~/.tqsl/station_data (Linux/macOS)
#                                  # or %APPDATA%\TrustedQSL\station_data
#                                  # (Windows)
# station_location = "Home"        # DEPRECATED, ignored (logs a warning)

# ----------------------------------------
# [eqsl] — eQSL.cc
# ----------------------------------------

[eqsl]
# username = "W1ABC"
# password = "your-eqsl-password"

# ----------------------------------------
# [clublog] — Club Log (upload only)
# ----------------------------------------
#
# A single Club Log account can host multiple callsigns; the `callsign`
# field tells Club Log which log this upload belongs to.

[clublog]
# email = "you@example.com"
# password = "your-clublog-password"
# callsign = "W1ABC"

# ----------------------------------------
# [qrz] — QRZ.com Logbook (upload only)
# ----------------------------------------
#
# api_key is the per-account upload key from your QRZ logbook page.
# Distinct from QRZ XML subscription credentials.

[qrz]
# api_key = "ABCD-1234-EFGH-5678"

# ----------------------------------------
# [hrdlog] — HRDLog (upload only)
# ----------------------------------------
#
# `code` is HRDLog's per-account "upload code" — distinct from the
# website password. Find it on hrdlog.net under Account → Settings.

[hrdlog]
# callsign = "W1ABC"
# code = "your-hrdlog-upload-code"
